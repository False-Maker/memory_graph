name: Focused Real Smoke Reusable

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      evidence-prefix:
        required: true
        type: string
      run-script:
        required: true
        type: string
      task-id:
        required: true
        type: string
      include-seed:
        required: false
        type: string
        default: 'true'
      include-default-png:
        required: false
        type: string
        default: 'true'
      extra-paths:
        required: false
        type: string
        default: ''

jobs:
  focused-real-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run focused real smoke compare flow
        uses: ./.github/actions/focused-real-smoke-compare
        with:
          evidence-prefix: ${{ inputs.evidence-prefix }}
          run-script: ${{ inputs.run-script }}
          task-id: ${{ inputs.task-id }}

      - name: Upload focused real smoke evidence
        uses: ./.github/actions/focused-real-smoke-upload
        with:
          artifact-name: ${{ inputs.artifact-name }}
          evidence-prefix: ${{ inputs.evidence-prefix }}
          include-seed: ${{ inputs.include-seed }}
          include-default-png: ${{ inputs.include-default-png }}
          extra-paths: ${{ inputs.extra-paths }}
