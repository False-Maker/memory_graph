name: Remote Provider Verify

'on':
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/remote-provider-verify.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/api/package.json"
      - "frontend/api/package-lock.json"
      - "frontend/src-react/qa/**"
      - "src/**"
      - "config/settings.example.yaml"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/remote-provider-verify.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/api/package.json"
      - "frontend/api/package-lock.json"
      - "frontend/src-react/qa/**"
      - "src/**"
      - "config/settings.example.yaml"
      - "requirements.txt"

concurrency:
  group: remote-provider-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PLAYWRIGHT_BROWSERS_PATH: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify required remote secrets
        run: |
          missing=0
          if [ -z "$BIGMODEL_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing remote OpenAI-compatible credential. Set BIGMODEL_API_KEY or OPENAI_API_KEY."
            missing=1
          fi
          if [ -z "$BIGMODEL_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing remote Anthropic-compatible credential. Set BIGMODEL_API_KEY or ANTHROPIC_API_KEY."
            missing=1
          fi
          exit "$missing"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install sidecar dependencies
        run: npm --prefix frontend/api ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run remote provider verify
        run: npm --prefix frontend run qa:real-stack-smoke:remote:verify

      - name: Upload remote verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-provider-verify-evidence
          if-no-files-found: warn
          path: |
            .sisyphus/evidence/task-15-provider-readiness-remote.txt
            .sisyphus/evidence/task-15-provider-readiness-remote.json
            .sisyphus/evidence/task-15-provider-smoke-*-summary.txt
            .sisyphus/evidence/task-15-provider-smoke-*-error.txt
            .sisyphus/evidence/task-16-provider-matrix-summary-remote.txt
            .sisyphus/evidence/task-16-provider-matrix-summary-remote.json
            .sisyphus/evidence/task-16-provider-matrix-remote-*.log
            .sisyphus/evidence/task-14-real-*.txt
            .sisyphus/evidence/task-14-real-*.json
            .sisyphus/evidence/task-14-*.log
