name: Contract Guards

'on':
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/contract-guards.yml'
      - '.github/actions/focused-real-smoke-compare/**'
      - '.github/actions/focused-real-smoke-upload/**'
      - '.github/workflows/focused-real-smoke-reusable.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/api/package.json'
      - 'frontend/api/package-lock.json'
      - 'frontend/src-react/pages/**'
      - 'frontend/src-react/qa/**'
      - 'src/api/**'
      - 'src/core/config.py'
      - 'src/core/secret_store.py'
      - 'scripts/generate_api_docs.py'
      - 'tests/test_api_docs.py'
      - 'tests/test_config.py'
      - 'tests/test_config_api.py'
      - 'tests/test_query_api.py'
      - 'tests/test_query_trace.py'
      - 'tests/test_retrieval_facade.py'
      - 'tests/test_mcp_server.py'
      - 'tests/test_mcp_service.py'
      - 'tests/test_mcp_integration.py'
      - 'tests/test_secret_store.py'
      - 'docs/API.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/DEVELOPMENT.md'
      - 'docs/ROADMAP.md'
      - 'docs/Product_Engineering_Baseline.md'
      - 'docs/claude-review-followup.md'
      - 'README.md'
      - '.sisyphus/evidence/**'
      - 'config/settings.example.yaml'
      - 'requirements.txt'
      - 'src/core/query_trace.py'
      - 'src/core/retrieval_facade.py'
      - 'src/mcp/**'
  pull_request:
    paths:
      - '.github/workflows/contract-guards.yml'
      - '.github/actions/focused-real-smoke-compare/**'
      - '.github/actions/focused-real-smoke-upload/**'
      - '.github/workflows/focused-real-smoke-reusable.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/api/package.json'
      - 'frontend/api/package-lock.json'
      - 'frontend/src-react/pages/**'
      - 'frontend/src-react/qa/**'
      - 'src/api/**'
      - 'src/core/config.py'
      - 'src/core/secret_store.py'
      - 'scripts/generate_api_docs.py'
      - 'tests/test_api_docs.py'
      - 'tests/test_config.py'
      - 'tests/test_config_api.py'
      - 'tests/test_query_api.py'
      - 'tests/test_query_trace.py'
      - 'tests/test_retrieval_facade.py'
      - 'tests/test_mcp_server.py'
      - 'tests/test_mcp_service.py'
      - 'tests/test_mcp_integration.py'
      - 'tests/test_secret_store.py'
      - 'docs/API.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/DEVELOPMENT.md'
      - 'docs/ROADMAP.md'
      - 'docs/Product_Engineering_Baseline.md'
      - 'docs/claude-review-followup.md'
      - 'README.md'
      - '.sisyphus/evidence/**'
      - 'config/settings.example.yaml'
      - 'requirements.txt'
      - 'src/core/query_trace.py'
      - 'src/core/retrieval_facade.py'
      - 'src/mcp/**'

concurrency:
  group: contract-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install sidecar dependencies
        run: npm --prefix frontend/api ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify startup/runtime contract guards
        run: npm --prefix frontend run test:startup-contract

      - name: Verify import/runtime contract guards
        run: npm --prefix frontend run test:import-contract

      - name: Verify settings/frontend contract guards
        run: npm --prefix frontend run test:settings-contract

      - name: Verify search/graph/communities/memories contract guards
        run: npm --prefix frontend run test:mainline-contract

      - name: Verify API docs drift guard
        run: python3 scripts/generate_api_docs.py --check

      - name: Run focused Python contract tests
        run: python3 -m pytest tests/test_api_docs.py tests/test_config_api.py tests/test_config.py tests/test_secret_store.py tests/test_query_api.py tests/test_query_trace.py tests/test_retrieval_facade.py tests/test_mcp_server.py tests/test_mcp_service.py tests/test_mcp_integration.py

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build sidecar
        run: npm --prefix frontend/api run build

  # BEGIN generated focused real smoke jobs
  settings-secret-store-real-smoke:
    uses: ./.github/workflows/focused-real-smoke-reusable.yml
    with:
      artifact-name: settings-secret-store-real-smoke-evidence
      evidence-prefix: task-22-settings-secret-store-real
      run-script: qa:real-stack-smoke:settings:secret-store
      task-id: task-22
      include-seed: 'false'

  import-diagnostics-real-smoke:
    uses: ./.github/workflows/focused-real-smoke-reusable.yml
